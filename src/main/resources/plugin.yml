main: com.VintageGaming.VintagePerms.PermsMain
version: 2.6
name: VintagePerms
author: VintageGaming
description: Permissions Plugin like Pex and Group Manager!
api-version: 1.21
softdepend:
  - Vault
loadbefore:
  - Essentials

commands:
  vperms:
    usage: /<command> <args> [opt args]
    description: Main VintagePerms Command
    aliases: [vp, pex]
  vconvert:
    usage: /<command>
    description: Convert Old Files to New
permissions:
  vperms.*:
    description: God Permission for All of VintagePerms
    default: op
  vperms.user.*:
    description: God Permission for User Actions in VintagePerms
    default: op
  vperms.groups.*:
    description: God Permission for Group Actions in VintagePerms
    default: op
  vperms.usages:
    description: Display the Different Usages for VintagePerms
    default: op
  vperms.reload:
    description: Reload VintagePerms Config Files
    default: op
  vperms.user.addperm:
    description: Add Permissions to a Specific Player
    default: op
  vperms.user.removeperm:
    description: Remove Permissions of a Specific Player
    default: op
  vperms.user.listperms:
    description: List Permissions of a Specific Player
    default: op
  vperms.groups.create:
    description: Create a New Permissions Group
    default: op
  vperms.groups.remove:
    description: Delete a Permissions Group
    default: op
  vperms.groups.addperm:
    description: Add Permissions to a Permissions Group
    default: op
  vperms.groups.removeperm:
    description: Remove Permissions of a Permissions Group
    default: op
  vperms.groups.listperms:
    description: List Permissions of a Permissions Group
    default: op
  vperms.groups.setprefix:
    description: Set Prefix of a Permissions Group
    default: op